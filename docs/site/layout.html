<!doctype html>
<html lang="en" class="{kind}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{description}">
  <title>{title}</title>
  <script>(function(){var r=document.documentElement,m=location.hash.match(/^#(dark|light)$/);r.classList.add("js");if(m)r.setAttribute("data-theme",m[1]);else if(r.classList.contains("home")&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))r.classList.add("intro");})();</script>
  <style>
{style}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <div class="page">
    <header class="top">
      <a class="brand" href="{root}" aria-label="EGTRAIN home">
        <svg class="mark" viewBox="64 64 896 896" aria-hidden="true">
          <rect class="tile" x="64" y="64" width="896" height="896" rx="208"/>
          <path class="e" d="M300 276V748M300 276H724M300 512H650M300 748H724"/>
          <circle class="g" cx="724" cy="276" r="44"/><circle class="r" cx="650" cy="512" r="44"/><circle class="g" cx="724" cy="748" r="44"/>
        </svg>
        EGTRAIN
      </a>
      <nav aria-label="Main">
        <ul>
          <li><a href="{root}#download">Download</a></li>
          <li><a href="{root}#documentation">Documentation</a></li>
          <li><a href="{root}support/">Support</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" tabindex="-1">
{main}
    </main>

    <footer>
      <p>The source code is licensed under the GNU General Public License, version 3 only.</p>
      <nav aria-label="Site"><ul><li><a href="{root}source/">Source code</a></li><li><a href="{root}support/">Support</a></li><li><a href="{root}privacy/">Privacy</a></li></ul></nav>
    </footer>
  </div>
</body>
</html>
