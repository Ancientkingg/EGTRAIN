name: Format

on:
  pull_request:
    branches: [main]
    paths:
      - 'EGTRAIN/QEGTRAIN/**'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'tools/format.py'
      - '.github/workflows/format.yml'
  workflow_dispatch:

jobs:
  check:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The version is the one tools/format.py accepts.
      - name: Install clang-format
        run: python3 -m pip install 'clang-format==23.1.3'
      - name: Check the format of the sources
        run: python3 tools/format.py
