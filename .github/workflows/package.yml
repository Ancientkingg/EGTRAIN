name: Package

# Builds the macOS, Windows, and Linux packages and uploads each as an artifact of the run.
# The macOS package is a disk image. The Windows package is also built into an installer and a portable archive,
# which are artifacts too. A push to production or a v* tag signs the three Windows program files first and the installer
# last when the repository variable WINDOWS_SIGNING is signpath; every other run builds unsigned files and reports their
# signatures. The macOS app is signed ad hoc, except in a push to production or a v* tag when the environment macos-signing
# holds a Developer ID certificate: then tools/release/sign_macos.sh signs it with that identity. With notarization
# credentials in that environment as well, tools/release/notarize_macos.sh notarizes and staples the app, and then the disk
# image built from it.
# After the Linux package, the Rehearse Linux job runs the clean-install steps 1 to 9 of the release testing checklist on that
# AppImage, on a runner with a virtual display. Its screenshots and logs are the artifact linux-rehearsal-evidence, which is
# for diagnosis and is not a release asset.
# The release workflow and the package check call this workflow with the version to build. Every package is built with
# Qt 6.8.3 from install-qt-action.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  package-macos:
    name: Package macOS
    # A push to production or a v* tag runs in the environment macos-signing, which holds the Developer ID certificate, its
    # password and the variable MACOS_SIGNING_IDENTITY. Every other run has no environment, so it cannot read them.
    environment: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) && 'macos-signing' || '' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the packages of the manual
        # The build makes the manual EGTRAIN.qch from docs/guides with Sphinx in this environment.
        run: |
          python -m venv build/docs-venv
          build/docs-venv/bin/python -m pip install -r docs/requirements.txt

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtcharts
          cache: true

      - name: Install dependencies
        run: brew install zeromq cppzmq nlohmann-json

      # As in cmake.yml: the keg folders of the other libraries, and the OpenGL framework in place of the AGL framework that
      # Qt 6.8.3 links and that the macOS 26 SDK no longer has.
      - name: Configure
        run: >
          cmake -S . -B build "-DEGTRAIN_VERSION=${{ inputs.version }}"
          -DCMAKE_BUILD_TYPE=Release
          -DEGTRAIN_PACKAGED_BUILD=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix zeromq);$(brew --prefix cppzmq);$(brew --prefix nlohmann-json)"
          -DWrapOpenGL_AGL="$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenGL.framework"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Verify update helper transaction
        run: ctest --test-dir build -R '^test_update(helper|preparation)$' --output-on-failure

      - name: Test the notarization script
        # The script runs here against stand-ins for Apple's tools, so a change to it is tried before a release needs it.
        run: bash tools/release/test_notarize_macos.sh

      - name: Test the build path script
        # The script runs here against a library built with Homebrew paths, so a change to it is tried before a release needs it.
        run: python3 tools/release/test_macos_build_paths.py

      - name: Bundle Qt and dependencies into the app
        run: bash tools/release/package_macos.sh bundle build/QEGTRAIN.app

      - name: Add scene_tool and the licence files to the app
        # The signature below seals them.
        run: bash tools/release/package_macos.sh add-files build/QEGTRAIN.app

      - name: Remove unused Qt modules and plugins
        run: bash tools/release/package_macos.sh trim build/QEGTRAIN.app

      - name: Keep only the arm64 code of the Qt 6 libraries
        run: bash tools/release/package_macos.sh thin build/QEGTRAIN.app

      - name: Remove build machine paths
        # The signature below seals the result, and the check after it fails when a path is left.
        run: bash tools/release/package_macos.sh strip-paths build/QEGTRAIN.app

      - name: Set the minimum macOS version
        # The signature below seals the property list.
        run: bash tools/release/package_macos.sh min-version build/QEGTRAIN.app

      - name: Import the signing certificate
        # The certificate goes into a keychain of its own, which the last step deletes, and the file it came from is removed at
        # once. Without a certificate the step does nothing and the app keeps the ad-hoc signature. This is the only step that
        # reads the certificate and its password. It passes the identity to the later steps through the environment.
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "macOS signing: no Developer ID certificate is configured, so the app keeps the ad-hoc signature." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$IDENTITY" ]; then
            echo "ERROR: the certificate is configured, but its password or the variable MACOS_SIGNING_IDENTITY is not"
            exit 1
          fi
          keychain="$RUNNER_TEMP/egtrain-signing.keychain-db"
          certificate="$RUNNER_TEMP/egtrain-signing-certificate.p12"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if ! grep -qF "$IDENTITY" <<< "$identities"; then
            echo "ERROR: the keychain holds no valid code signing identity with the name in MACOS_SIGNING_IDENTITY"
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "macOS signing: the app is signed with the Developer ID identity of the environment." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign the app
        # macdeployqt rewrites install names with install_name_tool, which
        # invalidates the code signature. Apple Silicon kills a binary with a
        # broken signature at load (SIGKILL), so the bundle is signed again.
        # Without an identity the signature is ad-hoc: students still see a
        # Gatekeeper warning on first open, but the app launches instead of being
        # killed. With one, the script signs each nested file and then the bundle.
        run: bash tools/release/sign_macos.sh build/QEGTRAIN.app

      - name: Verify the app is self-contained
        run: bash tools/release/package_macos.sh verify-contents build/QEGTRAIN.app

      - name: Verify the signature
        # Prints who signed the app and requires a Developer ID signature with an identity and an ad-hoc one without.
        run: bash tools/release/package_macos.sh verify-signature build/QEGTRAIN.app

      - name: Verify the packaged app
        # The next step runs the app, from a copy.
        run: bash tools/release/package_macos.sh verify-package build/QEGTRAIN.app

      - name: Start the package
        # The program may write files next to itself, so it starts from a copy and the app for the disk image stays as built.
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          start="$RUNNER_TEMP/package-start"
          rm -rf "$start"
          mkdir -p "$start"
          ditto build/QEGTRAIN.app "$start/QEGTRAIN.app"
          python3 tools/release/package_start_smoke.py "$start"

      - name: Generate scene bundles
        run: |
          set -euo pipefail
          mkdir -p build/scene-bundles
          scenes=(
            Netherlands
            Paimpol
            Copenhagen
            Milano_Brescia
            Assignment_Gvc_Gdg_Ut
            Amsterdam_Hilversum_Student
          )
          for name in "${scenes[@]}"; do
            bundle="build/scene-bundles/$name.egscene"
            build/scene_tool pack "EGTRAIN/QEGTRAIN/Scenes/$name" "$bundle"
            validation_log="$RUNNER_TEMP/$name-bundle-validation.log"
            if ! build/scene_tool validate "$bundle" >"$validation_log" 2>&1; then
              cat "$validation_log"
              exit 1
            fi
          done

      - name: Upload scene bundles
        uses: actions/upload-artifact@v4
        with:
          name: EGTRAIN-scenes
          path: build/scene-bundles/*.egscene
          if-no-files-found: error

      - name: Notarize the app
        # The app is notarized and gets its ticket before the disk image is built, so a copy of the app taken out of the image
        # passes Gatekeeper without a network. The script reads the notarization credentials of the environment macos-signing
        # from this step alone and does nothing without them: the app is then not notarized. When it runs, a verdict other
        # than Accepted, or a ticket or an assessment that fails, fails the job.
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) }}
        timeout-minutes: 60
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ vars.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash tools/release/notarize_macos.sh build/QEGTRAIN.app

      - name: Build the disk image
        # The app is final: no later step changes it.
        run: python3 tools/release/make_dmg.py --version "${{ inputs.version }}" --app build/QEGTRAIN.app --output build/dmg --layout

      - name: Sign the disk image
        # Gatekeeper assesses the image as well as the app in it. The image gets the Developer ID identity of the app; without
        # an identity it stays unsigned, as the app keeps its ad-hoc signature.
        run: |
          set -euo pipefail
          DMG="build/dmg/EGTRAIN-${{ inputs.version }}-macOS-arm64.dmg"
          if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
            echo "macOS signing: no Developer ID identity, so the disk image is not signed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize the disk image
        # The same script, credentials and rules as for the app. The image is notarized and stapled last, and the next step
        # checks the app in it.
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) }}
        timeout-minutes: 60
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ vars.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash tools/release/notarize_macos.sh build/dmg/EGTRAIN-${{ inputs.version }}-macOS-arm64.dmg

      - name: Verify the disk image
        # Mount the image read-only, as a user does, and take the app out of it with ditto. The copy is what a drag
        # to Applications gives, so it has to keep its signature and has to run.
        run: |
          set -euo pipefail
          DMG="$PWD/build/dmg/EGTRAIN-${{ inputs.version }}-macOS-arm64.dmg"
          MOUNT="$RUNNER_TEMP/dmg-mount"
          COPY="$RUNNER_TEMP/dmg-copy"
          RUN_DIR="$RUNNER_TEMP/qegtrain-dmg-paimpol"
          rm -rf "$MOUNT" "$COPY" "$RUN_DIR"
          mkdir -p "$MOUNT" "$COPY" "$RUN_DIR"
          # Detach the image on every path, by force when it is busy or when the step fails while it is attached.
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$MOUNT" "$DMG"
          # The volume holds the app, the link to /Applications and the hidden Finder layout file, and no scene folder,
          # scene_tool or guide beside the app.
          test "$(LC_ALL=C ls -A "$MOUNT" | tr '\n' ' ')" = ".DS_Store Applications QEGTRAIN.app "
          test "$(readlink "$MOUNT/Applications")" = "/Applications"
          cmp "$MOUNT/.DS_Store" tools/release/dmg/DS_Store
          codesign --verify --deep --strict --verbose=2 "$MOUNT/QEGTRAIN.app"
          # Finder takes the file type from the property list of the app in the image. The app declares .egscene as its
          # one document type, and the type conforms to public.data only, so no archive type is claimed.
          PLIST="$MOUNT/QEGTRAIN.app/Contents/Info.plist"
          expect_plist() {
            local actual
            actual="$(/usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>&1)" || actual="no entry"
            [ "$actual" = "$2" ] || { echo "ERROR: $1 in the Info.plist of the app in the disk image is '$actual', not '$2'"; exit 1; }
          }
          expect_no_plist() {
            if /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" >/dev/null 2>&1; then
              echo "ERROR: unexpected $1 in the Info.plist of the app in the disk image"
              exit 1
            fi
          }
          expect_plist CFBundleDocumentTypes:0:CFBundleTypeName "EGTRAIN Case"
          expect_plist CFBundleDocumentTypes:0:CFBundleTypeRole Editor
          expect_plist CFBundleDocumentTypes:0:LSHandlerRank Owner
          expect_plist CFBundleDocumentTypes:0:LSItemContentTypes:0 com.egtrain.simulator.egscene
          expect_no_plist CFBundleDocumentTypes:0:LSItemContentTypes:1
          expect_no_plist CFBundleDocumentTypes:1
          expect_plist UTExportedTypeDeclarations:0:UTTypeIdentifier com.egtrain.simulator.egscene
          expect_plist UTExportedTypeDeclarations:0:UTTypeConformsTo:0 public.data
          expect_no_plist UTExportedTypeDeclarations:0:UTTypeConformsTo:1
          expect_plist UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0 egscene
          expect_no_plist UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:1
          expect_no_plist UTExportedTypeDeclarations:1
          expect_no_plist UTImportedTypeDeclarations
          ditto "$MOUNT/QEGTRAIN.app" "$COPY/QEGTRAIN.app"
          hdiutil detach "$MOUNT" || hdiutil detach "$MOUNT" -force
          trap - EXIT
          codesign --verify --deep --strict --verbose=2 "$COPY/QEGTRAIN.app"
          test -x "$COPY/QEGTRAIN.app/Contents/MacOS/QEGTRAIN"
          test -x "$COPY/QEGTRAIN.app/Contents/MacOS/egtrain_update_helper"
          test -x "$COPY/QEGTRAIN.app/Contents/MacOS/scene_tool"
          test -f "$COPY/QEGTRAIN.app/Contents/Resources/LICENSE"
          test -f "$COPY/QEGTRAIN.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -d "$COPY/QEGTRAIN.app/Contents/Resources/Scenes/Paimpol"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$COPY/QEGTRAIN.app/Contents/Info.plist")"
          [ "$identifier" = "com.egtrain.simulator" ] || { echo "ERROR: the app in the disk image has the identifier $identifier"; exit 1; }
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$COPY/QEGTRAIN.app/Contents/Info.plist")"
          [ "$version" = "${{ inputs.version }}" ] || { echo "ERROR: the app in the disk image is version $version, not ${{ inputs.version }}"; exit 1; }
          cd "$RUN_DIR"
          set +e
          QEGTRAIN_OUTPUT_DIR="$RUN_DIR" \
          "$COPY/QEGTRAIN.app/Contents/MacOS/QEGTRAIN" --scene "$COPY/QEGTRAIN.app/Contents/Resources/Scenes/Paimpol" -h 300 -g 0 -pax 0 >"$RUN_DIR/qegtrain.log" 2>&1
          run_status=$?
          set -e
          if [ "$run_status" -ne 0 ]; then
            cat "$RUN_DIR/qegtrain.log"
          fi
          [ "$run_status" -eq 0 ]
          if ! grep -q "End of Simulation" "$RUN_DIR/qegtrain.log"; then
            cat "$RUN_DIR/qegtrain.log"
            exit 1
          fi
          if ! test -f "$RUN_DIR/Output/Paimpol/EnergyConsumptionPerTrain.txt"; then
            cat "$RUN_DIR/qegtrain.log"
            exit 1
          fi
          echo "OK: the app in the disk image keeps its signature, its files and runs from a copy"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QEGTRAIN-macos-arm64
          path: build/dmg/EGTRAIN-${{ inputs.version }}-macOS-arm64.dmg
          if-no-files-found: error

      - name: Delete the signing keychain
        if: ${{ always() && env.MACOS_KEYCHAIN != '' }}
        run: security delete-keychain "$MACOS_KEYCHAIN"

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtcharts
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install the packages of the manual
        # The build makes the manual EGTRAIN.qch from docs/guides with Sphinx in this environment.
        shell: pwsh
        run: |
          python -m venv build/docs-venv
          & build/docs-venv/Scripts/python.exe -m pip install -r docs/requirements.txt

      # The configure step installs ZeroMQ, cppzmq and nlohmann-json from the manifest tools/vcpkg/vcpkg.json, at its
      # builtin-baseline, with the vcpkg of the runner image, as the Windows leg of cmake.yml does. They go into the installed
      # folder of that vcpkg, where the package step takes the DLLs from.
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build "-DEGTRAIN_VERSION=${{ inputs.version }}"
          -DEGTRAIN_PACKAGED_BUILD=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/tools/vcpkg"
          -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLATION_ROOT/installed"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Verify update helper transaction
        run: ctest --test-dir build -C Release -R '^test_update(helper|preparation)$' --output-on-failure

      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist/QEGTRAIN"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter QEGTRAIN.exe | Select-Object -First 1
          if (-not $exe) { throw "QEGTRAIN.exe not found under build/" }
          Copy-Item $exe.FullName "$dist/QEGTRAIN.exe"
          $helper = Get-ChildItem -Path build -Recurse -Filter egtrain_update_helper.exe | Select-Object -First 1
          if (-not $helper) { throw "egtrain_update_helper.exe not found under build/" }
          Copy-Item $helper.FullName "$dist/egtrain_update_helper.exe"
          # ZeroMQ + libsodium runtime DLLs from vcpkg
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" $dist/ -ErrorAction SilentlyContinue
          # Qt runtime: DLLs + platform/imageformat plugins next to the exe
          # The application draws with the raster engine: no software OpenGL, Direct3D or DXC compiler or Qt Quick files are deployed.
          # The windeployqt of Qt 6 has no ANGLE or virtual keyboard option: Qt 6 has no ANGLE, and the virtual keyboard is not installed.
          # The Visual C++ runtime DLLs are copied by the next step, not by windeployqt: it would copy the redistributable installer.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler --no-quick-import "$dist/QEGTRAIN.exe"
          # The manual reads its help file through the SQLite driver. The other database drivers need client libraries that the package does not hold.
          Get-ChildItem "$dist/sqldrivers" -File | Where-Object { $_.Name -ne "qsqlite.dll" } | Remove-Item
          # Canonical scenes and the manual ship beside the executable for packaged defaults.
          Copy-Item -Recurse EGTRAIN/QEGTRAIN/Scenes "$dist/Scenes"
          Copy-Item build/manual/EGTRAIN.qch "$dist/EGTRAIN.qch"
          # Presentation package: the command-line tool and the canonical scenes. scene_tool uses
          # header-only JSON and vendored miniz, so it needs no Qt.
          $tool = Get-ChildItem -Path build -Recurse -Filter scene_tool.exe | Select-Object -First 1
          if (-not $tool) { throw "scene_tool.exe not found under build/" }
          Copy-Item $tool.FullName "$dist/scene_tool.exe"
          # The licence text ships with the installer, which shows it, and with the portable archive.
          Copy-Item LICENSE "$dist/LICENSE"
          Copy-Item THIRD_PARTY_NOTICES.md "$dist/THIRD_PARTY_NOTICES.md"

      - name: Copy the Visual C++ runtime
        # The installer installs per user and cannot run the Visual C++ redistributable, so the runtime DLLs that the program files import
        # go next to QEGTRAIN.exe (app-local deployment). The Universal CRT is part of Windows 10 and 11 and is not copied. The folder name
        # holds the toolset version, so a glob finds it. A copied DLL can import another runtime DLL, so the copy repeats until none is missing.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist/QEGTRAIN"
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64/Microsoft.VC14*.CRT" -Directory | Select-Object -First 1
          if (-not $crt) { throw "no x64 Visual C++ runtime folder under '$env:VCToolsRedistDir'" }
          for ($round = 0; $round -lt 3; $round++) {
            $wanted = @(python tools/release/pe_imports.py $dist --missing | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)140' })
            if ($wanted.Count -eq 0) { break }
            foreach ($name in $wanted) {
              $source = Join-Path $crt.FullName $name
              if (-not (Test-Path -LiteralPath $source)) { throw "$name is not in $($crt.FullName)" }
              Copy-Item -LiteralPath $source "$dist/$name"
              "Copied $name from $($crt.FullName)"
            }
          }
          # The exit code of pe_imports.py is not an error here. The step "Check the DLL imports of the package" fails the job
          # when a runtime DLL is still missing after three rounds.
          exit 0

      - name: Verify the package is complete
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist/QEGTRAIN"
          if (-not (Test-Path "$dist/QEGTRAIN.exe")) { throw "missing QEGTRAIN.exe" }
          if (-not (Test-Path "$dist/egtrain_update_helper.exe")) { throw "missing egtrain_update_helper.exe" }
          foreach ($dll in @("Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll","Qt6Charts.dll","Qt6Svg.dll","Qt6Network.dll","Qt6Help.dll","Qt6Sql.dll")) {
            if (-not (Test-Path "$dist/$dll")) { throw "missing $dll" }
          }
          if (-not (Test-Path "$dist/platforms/qwindows.dll")) { throw "missing platforms/qwindows.dll" }
          if (-not (Test-Path "$dist/imageformats/qsvg.dll")) { throw "missing imageformats/qsvg.dll" }
          if (-not (Test-Path "$dist/iconengines/qsvgicon.dll")) { throw "missing iconengines/qsvgicon.dll" }
          if (-not (Test-Path "$dist/styles/qmodernwindowsstyle.dll")) { throw "missing styles/qmodernwindowsstyle.dll" }
          if (-not (Test-Path "$dist/sqldrivers/qsqlite.dll")) { throw "missing sqldrivers/qsqlite.dll" }
          if (-not (Test-Path "$dist/EGTRAIN.qch")) { throw "missing EGTRAIN.qch" }
          if (-not (Get-ChildItem "$dist" -Filter "libzmq*.dll")) { throw "missing libzmq DLL" }
          if (-not (Test-Path "$dist/scene_tool.exe")) { throw "missing scene_tool.exe" }
          if (-not (Test-Path "$dist/Scenes/Paimpol/scene.json")) { throw "missing canonical Paimpol scene" }
          if (-not (Test-Path "$dist/LICENSE")) { throw "missing LICENSE" }
          if (-not (Test-Path "$dist/THIRD_PARTY_NOTICES.md")) { throw "missing THIRD_PARTY_NOTICES.md" }
          foreach ($name in @("opengl32sw.dll","d3dcompiler_47.dll","dxcompiler.dll","dxil.dll","Qt6Quick*","Qt6Qml*","*VirtualKeyboard*","vc_redist*")) {
            $found = @(Get-ChildItem "$dist" -Recurse -File -Filter $name)
            if ($found.Count -gt 0) { throw "unexpected $name in the package: $($found[0].FullName)" }
          }
          Write-Host "OK: exe, Qt 6 runtime, libzmq, canonical scenes, scene_tool, and manual are present; the OpenGL, Direct3D and DXC compiler, Qt Quick, QML and virtual keyboard files and the Visual C++ redistributable are absent"

      - name: Check the DLL imports of the package
        # Fails when a program file imports a DLL that is neither in the package nor part of Windows. GitHub's runners have the Visual C++
        # runtime installed, so starting the package cannot show a runtime DLL that is missing.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/release/pe_imports.py dist/QEGTRAIN
          if ($LASTEXITCODE -ne 0) { throw "the package imports a DLL that it does not hold" }

      - name: Report package size
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem dist/QEGTRAIN -Recurse -File)
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          "Windows package: $($files.Count) files, $bytes bytes" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Report the code signatures
        # The files are unsigned here: the sign-windows job signs them after this job, when signing is set up. The report
        # is for the log and fails for no file.
        shell: pwsh
        run: ./tools/release/verify_signatures.ps1 -Directory dist/QEGTRAIN -Report

      - name: Start the package
        # The program writes files next to itself, so it starts from a copy and the directory that is uploaded stays as built.
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $start = "$env:RUNNER_TEMP/package-start/QEGTRAIN"
          New-Item -ItemType Directory -Force -Path $start | Out-Null
          Copy-Item -Recurse dist/QEGTRAIN/* $start
          python tools/release/package_start_smoke.py "$start"

      - name: Check HTTPS from the package
        # One real request to the GitHub release list through the update transport, as the update check makes it. The program starts
        # from the copy of the package that the previous step started, with only the Windows directories on PATH, so it uses the Qt
        # files of the package as a machine without a developer setup would. It fails when no HTTPS response arrives. It exits with
        # 77 when GitHub answers with its rate limit or an outage, which does not fail the job.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Get-ChildItem -Path build -Recurse -Filter test_updatetransport_https.exe | Select-Object -First 1
          if (-not $probe) { throw "test_updatetransport_https.exe not found under build/" }
          $start = "$env:RUNNER_TEMP/package-start/QEGTRAIN"
          Copy-Item $probe.FullName $start
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$start/test_updatetransport_https.exe" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 77) { throw "the HTTPS check failed with exit code $LASTEXITCODE" }
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QEGTRAIN-windows-x64-payload
          path: dist/QEGTRAIN
          include-hidden-files: true
          if-no-files-found: error

  sign-windows:
    name: Sign Windows
    # This job runs for a push to production or a v* tag when the repository variable WINDOWS_SIGNING is signpath, and never
    # for a pull request or a manual run. Its token belongs to the environment windows-signing, which only production and v*
    # may use. Only the three program files go to the signing service, so no Qt or other library is signed. The signed files
    # replace them in the payload artifact that finalize-windows downloads. The signing action reads the run and downloads the
    # uploaded files with the token of the job, which the action's documentation says needs actions: read and contents: read.
    needs: package-windows
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) && vars.WINDOWS_SIGNING == 'signpath' }}
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: QEGTRAIN-windows-x64-payload
          path: payload

      - name: Collect the files to sign
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          foreach ($name in @("QEGTRAIN.exe", "egtrain_update_helper.exe", "scene_tool.exe")) {
            Copy-Item -LiteralPath "payload/$name" -Destination unsigned
          }

      - name: Upload the files to sign
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: QEGTRAIN-windows-x64-unsigned
          path: unsigned
          overwrite: true
          if-no-files-found: error

      - name: Sign the files
        # The service waits for the approval of a person, so the wait is long.
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Put the signed files into the package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("QEGTRAIN.exe", "egtrain_update_helper.exe", "scene_tool.exe")) {
            Copy-Item -LiteralPath "signed/$name" -Destination payload -Force
          }

      - name: Verify the signatures
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: ./tools/release/verify_signatures.ps1 -Directory payload -Require -ExpectedSubject $env:EXPECTED_SUBJECT

      - name: Upload the signed package
        uses: actions/upload-artifact@v4
        with:
          name: QEGTRAIN-windows-x64-payload
          path: payload
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error

  finalize-windows:
    name: Finalize Windows
    # The job reads the unsigned package when signing is skipped and the signed one when signing succeeded. It does not run
    # when signing failed, so no installer or archive comes from files that were not signed. When signing succeeded, the job
    # sign-windows-installer signs the installer that this job uploads.
    needs: [package-windows, sign-windows]
    if: ${{ !cancelled() && needs.package-windows.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: QEGTRAIN-windows-x64-payload
          path: payload

      - name: Find Inno Setup
        # The runner image may have it. If it does not, the pinned version comes from Chocolatey.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The installation folders come first: ISCC.exe on the PATH can be a Chocolatey shim without version information.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.Source })
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version 6.4.3 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco could not install Inno Setup" }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found" }
          # ISCC.exe may carry no version (0.0.0.0); the IDE next to it, Compil32.exe, carries the release version.
          $found = @($iscc, (Join-Path (Split-Path -Parent $iscc) "Compil32.exe")) |
            Where-Object { Test-Path -LiteralPath $_ } |
            ForEach-Object { (Get-Item -LiteralPath $_).VersionInfo.FileVersion } |
            Where-Object { $_ -match '^[1-9]\d*\.\d+' } | Select-Object -First 1
          # installer/egtrain.iss needs 6.3 or newer. Without a readable version the compile step shows any mismatch.
          if ($found -match '^(\d+)\.(\d+)' -and ([int]$Matches[1] -lt 6 -or ([int]$Matches[1] -eq 6 -and [int]$Matches[2] -lt 3))) {
            throw "Inno Setup $found is older than 6.3"
          }
          if (-not $found) { $found = "unknown" }
          "Inno Setup compiler: $iscc, version $found" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build the installers
        # The second installer has the next patch version. The installer smoke installs it over the first to check an upgrade.
        # Only the first one is uploaded.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = (Resolve-Path payload).Path
          $current = [version]"${{ inputs.version }}"
          $newer = "$($current.Major).$($current.Minor).$($current.Build + 1)"
          & $env:ISCC "/DVersion=${{ inputs.version }}" "/DPayload=$payload" "/O$PWD\installer-out" installer\egtrain.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          & $env:ISCC "/DVersion=$newer" "/DPayload=$payload" "/O$PWD\installer-upgrade" installer\egtrain.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_ENV -Value "UPGRADE_VERSION=$newer"

      - name: Smoke test the installer
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/release/installer_smoke.ps1 `
            -Installer "installer-out/EGTRAIN-Setup-${{ inputs.version }}-x64.exe" `
            -UpgradeInstaller "installer-upgrade/EGTRAIN-Setup-$($env:UPGRADE_VERSION)-x64.exe" `
            -Payload payload `
            -Version "${{ inputs.version }}" `
            -UpgradeVersion "$env:UPGRADE_VERSION" `
            -Work "$env:RUNNER_TEMP/installer-smoke"

      - name: Build the portable archive
        # The archive comes from the same directory as the installer.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/release/build_release_assets.py --version "${{ inputs.version }}" --payload payload --output portable
          if ($LASTEXITCODE -ne 0) { throw "the portable archive was not built" }

      - name: Start the portable archive
        # The archive is extracted without an installer and its program is started, as the package jobs start their packages.
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $start = "$env:RUNNER_TEMP/portable-start"
          python -m zipfile -e "portable/EGTRAIN-Portable-${{ inputs.version }}-x64.zip" $start
          if ($LASTEXITCODE -ne 0) { throw "the portable archive could not be extracted" }
          python tools/release/pe_imports.py "$start"
          if ($LASTEXITCODE -ne 0) { throw "the portable archive imports a DLL that it does not hold" }
          python tools/release/package_start_smoke.py "$start"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: EGTRAIN-windows-x64-installer
          path: installer-out/EGTRAIN-Setup-${{ inputs.version }}-x64.exe
          if-no-files-found: error

      - name: Upload the portable archive
        uses: actions/upload-artifact@v4
        with:
          name: EGTRAIN-windows-x64-portable
          path: portable/EGTRAIN-Portable-${{ inputs.version }}-x64.zip
          if-no-files-found: error

      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-windows-diagnostics
          path: ${{ runner.temp }}/installer-smoke/logs/*.log
          if-no-files-found: ignore

  sign-windows-installer:
    name: Sign Windows installer
    # This job runs when sign-windows signed the program files, and in no other run. The finalize job then compiled the installer
    # from the signed files and uploaded it unsigned. The job sends the installer alone to the signing service, checks the
    # signatures of the installer and of the three program files of the payload that the installer and the portable archive were
    # built from, and only then replaces the installer artifact with the signed file. The release workflow runs its release job
    # only after the whole package workflow succeeded, so a failure here stops the release.
    needs: [sign-windows, finalize-windows]
    if: ${{ needs.sign-windows.result == 'success' }}
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: QEGTRAIN-windows-x64-payload
          path: payload

      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: EGTRAIN-windows-x64-installer
          path: installer

      - name: Upload the installer to sign
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: EGTRAIN-windows-x64-installer-unsigned
          path: installer/EGTRAIN-Setup-${{ inputs.version }}-x64.exe
          overwrite: true
          if-no-files-found: error

      - name: Sign the installer
        # The service waits for the approval of a person, so the wait is long.
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify the program files
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: ./tools/release/verify_signatures.ps1 -Directory payload -Require -ExpectedSubject $env:EXPECTED_SUBJECT

      - name: Verify the installer
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: ./tools/release/verify_signatures.ps1 -Directory signed -Name "EGTRAIN-Setup-${{ inputs.version }}-x64.exe" -Require -ExpectedSubject $env:EXPECTED_SUBJECT

      - name: Upload the signed installer
        uses: actions/upload-artifact@v4
        with:
          name: EGTRAIN-windows-x64-installer
          path: signed/EGTRAIN-Setup-${{ inputs.version }}-x64.exe
          overwrite: true
          if-no-files-found: error

  package-linux:
    name: Package Linux
    # The AppImage needs the glibc of the system that builds it, so it is built on the oldest Ubuntu it supports,
    # 24.04, and not on ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the packages of the manual
        # The build makes the manual EGTRAIN.qch from docs/guides with Sphinx in this environment.
        run: |
          python3 -m venv build/docs-venv
          build/docs-venv/bin/python -m pip install -r docs/requirements.txt

      # The action also installs the X11 libraries that the Qt 6 platform plugin loads, libxcb-cursor0 among them. It puts the
      # qmake of Qt 6 first on PATH and the Qt library folder on LD_LIBRARY_PATH, where the AppImage step and linuxdeploy find them.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtcharts
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake patchelf wget file desktop-file-utils \
            libzmq3-dev cppzmq-dev nlohmann-json3-dev xvfb xauth

      - name: Configure
        run: >
          cmake -S . -B build "-DEGTRAIN_VERSION=${{ inputs.version }}" -DCMAKE_BUILD_TYPE=Release -DEGTRAIN_PACKAGED_BUILD=ON
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Verify update helper transaction
        run: ctest --test-dir build -R '^test_update(helper|preparation)$' --output-on-failure

      - name: Assemble AppDir
        run: |
          set -euxo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          EXE="$(find build -type f -perm -111 -name QEGTRAIN | head -n 1)"
          test -n "$EXE"
          cp "$EXE" "$APPDIR/usr/bin/QEGTRAIN"
          HELPER="$(find build -type f -perm -111 -name egtrain_update_helper | head -n 1)"
          test -n "$HELPER"
          cp "$HELPER" "$APPDIR/usr/bin/egtrain_update_helper"

          # Canonical scenes and the manual live beside the executable for packaged defaults.
          cp -R EGTRAIN/QEGTRAIN/Scenes "$APPDIR/usr/bin/Scenes"
          cp build/manual/EGTRAIN.qch "$APPDIR/usr/bin/EGTRAIN.qch"

          # Presentation package: the command-line tool, bundled beside the executable.
          # scene_tool uses header-only JSON and vendored miniz, so it carries no Qt dependency.
          TOOL="$(find build -type f -perm -111 -name scene_tool | head -n 1)"
          test -n "$TOOL"
          cp "$TOOL" "$APPDIR/usr/bin/scene_tool"
          test -x "$APPDIR/usr/bin/scene_tool"
          test -f "$APPDIR/usr/bin/Scenes/Paimpol/scene.json"
          mkdir -p "$APPDIR/usr/share/doc/egtrain"
          cp LICENSE THIRD_PARTY_NOTICES.md "$APPDIR/usr/share/doc/egtrain/"
          cp EGTRAIN/QEGTRAIN/resources/app/egtrain-256.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/qegtrain.png"

          cat > "$APPDIR/usr/share/applications/qegtrain.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EGTRAIN
          Exec=QEGTRAIN
          Icon=qegtrain
          Categories=Education;Science;
          Terminal=false
          EOF
          chmod +x "$APPDIR/usr/bin/QEGTRAIN"

      # linuxdeploy deploys every database driver of Qt and stops at one whose client library is missing, such as the
      # Mimer SQL driver of Qt 6. The manual needs only the SQLite driver.
      - name: Keep only the SQLite driver of Qt 6
        run: find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name 'libqsqlite.so' -delete

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # The linker drops Qt Svg from the program, which uses none of its symbols, so linuxdeploy-plugin-qt does not see
          # the module and leaves out the SVG icon engine, without which the icons are scaled up from one size and blurred.
          EXTRA_QT_MODULES: svg
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '\r\n' < build/EGTRAIN_VERSION)"
          test -n "$VERSION"
          export VERSION
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage appimagetool-x86_64.AppImage

          export QMAKE
          QMAKE="$(command -v qmake)"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/QEGTRAIN \
            --desktop-file AppDir/usr/share/applications/qegtrain.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/qegtrain.png \
            --plugin qt

          ./appimagetool-x86_64.AppImage AppDir QEGTRAIN-linux-x86_64.AppImage

      - name: Verify AppImage contents
        run: |
          set -euxo pipefail
          test -s QEGTRAIN-linux-x86_64.AppImage
          chmod +x QEGTRAIN-linux-x86_64.AppImage
          ./QEGTRAIN-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/QEGTRAIN
          test -x squashfs-root/usr/bin/egtrain_update_helper
          test -f squashfs-root/usr/bin/Scenes/Paimpol/scene.json
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/qegtrain.png
          test -f squashfs-root/AppRun
          test -f squashfs-root/usr/share/doc/egtrain/LICENSE
          test -f squashfs-root/usr/share/doc/egtrain/THIRD_PARTY_NOTICES.md
          test -f squashfs-root/usr/bin/EGTRAIN.qch
          find squashfs-root -name 'libQt6Core.so*' -print -quit | grep -q .
          find squashfs-root -name 'libQt6Svg.so*' -print -quit | grep -q .
          find squashfs-root -name 'libQt6Network.so*' -print -quit | grep -q .
          find squashfs-root -path '*/imageformats/libqsvg.so' -print -quit | grep -q .
          find squashfs-root -path '*/iconengines/libqsvgicon.so' -print -quit | grep -q .
          find squashfs-root -name 'libQt6Help.so*' -print -quit | grep -q .
          find squashfs-root -path '*/sqldrivers/libqsqlite.so' -print -quit | grep -q .
          echo "OK: AppImage contains executable, Qt runtime, canonical Scenes and the manual"

      # Set up here and not at the top of the job: the action exports a library path, and the image is built without it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start the package
        # The AppImage is extracted into a directory of its own and started from there through its AppRun, on a virtual
        # X display, with the platform plugin that the image holds. The file that is uploaded stays as built.
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          start="$RUNNER_TEMP/package-start"
          rm -rf "$start"
          mkdir -p "$start"
          image="$PWD/QEGTRAIN-linux-x86_64.AppImage"
          (cd "$start" && "$image" --appimage-extract >/dev/null)
          find "$start/squashfs-root/usr/plugins" -type f | sort
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/release/package_start_smoke.py "$start/squashfs-root"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QEGTRAIN-linux-x86_64
          path: QEGTRAIN-linux-x86_64.AppImage
          if-no-files-found: error

  rehearse-linux:
    name: Rehearse Linux
    # A new runner on which the job installs no Qt package. It takes the AppImage that Package Linux uploaded, extracts it and starts it
    # through AppRun as a student does, with a new home directory and no QEGTRAIN_ variable, on a virtual display. The script
    # drives the menus and dialogs through the accessibility interface AT-SPI. It does not start a test hook, because the
    # release package has none. The job fails at the first step that does not pass. The release job needs this job through the
    # package job of the release workflow.
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/release

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: QEGTRAIN-linux-x86_64
          path: ${{ runner.temp }}/linux-rehearsal/download

      - name: Install the display, the accessibility bus and the test tools
        # xvfb is the display, dbus-x11 the session bus, at-spi2-core the accessibility bus. python3-gi with gir1.2-atspi-2.0
        # drives the widgets, xdotool types the keys and imagemagick reads the screen. The libraries on the last line are the ones
        # that the AppImage takes from the system and that every desktop has; Qt 6 also needs the OpenGL and EGL libraries of
        # the system, which an AppImage never holds. No Qt package is installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool imagemagick dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 \
            libgl1 libopengl0 libegl1 libharfbuzz0b libfontconfig1 libfreetype6 fonts-dejavu-core

      - name: Extract the AppImage and pack the downloaded bundle
        # The bundle is packed from the Paimpol scene of the image by the scene_tool of the image, so the job does not wait for
        # the macOS job, which uploads the bundles and finishes after the Windows jobs.
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/linux-rehearsal"
          mkdir -p "$work/package" "$work/Downloads"
          chmod +x "$work/download/QEGTRAIN-linux-x86_64.AppImage"
          (cd "$work/package" && "$work/download/QEGTRAIN-linux-x86_64.AppImage" --appimage-extract >/dev/null)
          image="$work/package/squashfs-root"
          "$image/usr/bin/scene_tool" pack "$image/usr/bin/Scenes/Paimpol" "$work/Downloads/Paimpol.egscene"
          if ! "$image/usr/bin/scene_tool" validate "$work/Downloads/Paimpol.egscene" >"$work/bundle-validation.log" 2>&1; then
            cat "$work/bundle-validation.log"
            exit 1
          fi

      - name: Rehearse the clean-install steps
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linux-rehearsal"
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- /usr/bin/python3 tools/release/linux_rehearsal.py \
            "$work/package/squashfs-root" "$work/Downloads/Paimpol.egscene" --work "$work/run" --evidence "$work/evidence" \
            --expected-version "${{ inputs.version }}"

      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-rehearsal-evidence
          path: ${{ runner.temp }}/linux-rehearsal/evidence
          if-no-files-found: warn
