name: Docs

# Builds the documentation site: the pages of docs/ with Sphinx and the C++ reference with Doxygen. A pull request also
# fails when it adds undocumented classes or members to the files it changes. A push to main publishes the site to dev/
# on the gh-pages branch; a push to production that makes a release publishes it to <version>/ and latest/.
on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

# A newer push to the same pull request replaces its running check. A push to a branch is never cancelled.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release workflow selects the version of a production push in the same way when its run starts, and does not
      # run for a push that changes only documentation. Such a push publishes no copy either.
      - name: Select the release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git -c core.quotepath=false diff --name-only "$BEFORE" HEAD) || files=unknown
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*) ;;
              *) python3 tools/release/version.py; exit 0 ;;
            esac
          done <<< "$files"
          echo "This push changes only documentation and makes no release."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Doxygen, Graphviz and the Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -fsSL https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
          python -m pip install -r docs/requirements.txt

      - name: Test the documentation scripts
        run: |
          python tools/docs/test_check_undocumented.py
          python tools/docs/check_docs.py

      - name: Build the site
        run: |
          doxygen docs/Doxyfile
          sphinx-build -W -b html docs build/docs

      - name: Check for new undocumented classes and members
        if: github.event_name == 'pull_request'
        run: python tools/docs/check_undocumented.py "${{ github.event.pull_request.base.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: build/docs
          retention-days: 7

  publish:
    name: Publish the site
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || needs.build.outputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Another run can push to gh-pages first, so a rejected push starts again from its new tip.
      - name: Push to gh-pages
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dir="${VERSION:-dev}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git worktree remove --force pages 2>/dev/null || true
            if git fetch --depth 1 origin gh-pages; then
              git worktree add --detach pages FETCH_HEAD
            else
              git worktree add --orphan -b gh-pages pages
            fi
            rm -rf "pages/$dir"
            cp -R site "pages/$dir"
            if [ "$dir" != dev ]; then
              rm -rf pages/latest
              cp -R site pages/latest
            fi
            touch pages/.nojekyll
            {
              echo '<!doctype html>'
              echo '<html lang="en"><head><meta charset="utf-8"><title>EGTRAIN documentation</title></head><body>'
              echo '<h1>EGTRAIN documentation</h1><ul>'
              [ -d pages/latest ] && echo '<li><a href="latest/">latest</a>: the newest release</li>'
              [ -d pages/dev ] && echo '<li><a href="dev/">dev</a>: the main branch</li>'
              for version in $(cd pages && ls -d [0-9]* 2>/dev/null | sort -rV); do
                echo "<li><a href=\"$version/\">$version</a></li>"
              done
              echo '</ul></body></html>'
            } > pages/index.html
            git -C pages add -A
            if git -C pages diff --cached --quiet; then
              exit 0
            fi
            git -C pages commit -q -m "Publish the documentation of $dir"
            if git -C pages push origin HEAD:refs/heads/gh-pages; then
              exit 0
            fi
          done
          exit 1
