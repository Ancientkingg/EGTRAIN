name: Docs

# Builds the documentation site: the pages of docs/ with Sphinx and the C++ reference with Doxygen. A pull request also
# fails when it adds undocumented classes or members to the files it changes. The site is published on
# egtrain.samuelbruin.com only. A push to main publishes it to dev/. A successful run of the Release workflow publishes the
# commit it released to <version>/, and to latest/ when no stable release tag has a higher version. Each publish also
# writes the home page, the support, contact and privacy pages and the source/ stub from docs/site/ of main and the feed
# of the website. The same runs keep the gh-pages branch, which GitHub Pages serves at the address that EGTRAIN 1.0.4 and
# 1.0.5 open from Help, as a redirect to the same paths on egtrain.samuelbruin.com.
on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

# A newer push to the same pull request replaces its running check. A push to a branch is never cancelled.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # A release tags the commit it releases with v<version>. A prerelease tag has a suffix and publishes no copy. The
      # output latest is true when no stable tag sorts higher, so that a release of an older line leaves latest/ alone.
      - name: Select the release version
        id: version
        if: github.event_name == 'workflow_run'
        run: |
          version="$(git tag --points-at HEAD | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 | cut -c 2-)"
          newest="$(git tag --list | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 | cut -c 2-)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ] && [ "$version" = "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Doxygen, Graphviz and the Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -fsSL https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
          python -m pip install -r docs/requirements.txt

      - name: Test the documentation scripts
        run: |
          python tools/docs/test_check_undocumented.py
          python tools/docs/check_docs.py
          python tools/e2e/test_ci_workflow.py
          python tools/release/test_publish_selfhost.py

      - name: Build the site
        run: |
          mkdir -p build/docs
          doxygen docs/Doxyfile
          sphinx-build -W -b html -d build/doctrees docs build/docs

      - name: Check for new undocumented classes and members
        if: github.event_name == 'pull_request'
        run: python tools/docs/check_undocumented.py "${{ github.event.pull_request.base.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: build/docs
          retention-days: 7

  publish:
    name: Publish the site
    needs: build
    if: github.event_name == 'push' || needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishing dev/ waits for an earlier run of main, and a run whose commit is no longer the tip of main skips it.
    concurrency:
      group: docs-publish-${{ github.event_name == 'push' && 'dev' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # The folders to publish, as copies of the site in pages/: dev/, or <version>/ and, when the build job found no
      # newer stable release, latest/. The output dirs names them for the next step.
      - name: Select the folders to publish
        id: pages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          dir="${VERSION:-dev}"
          if [ "$dir" = dev ] && [ "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has advanced; its newer run publishes dev/."
            exit 0
          fi
          mkdir pages
          cp -R site "pages/$dir"
          dirs="$dir"
          if [ "$dir" != dev ] && [ "$LATEST" = true ]; then
            cp -R site pages/latest
            dirs="$dir latest"
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      # The pages of the website list the versions of its feed, not the folders of this run, so a run of main and a run of
      # a release that publish at the same time leave the same pages.
      - name: Publish on egtrain.samuelbruin.com
        if: steps.pages.outputs.dirs != ''
        env:
          EGTRAIN_PUBLISH_TOKEN: ${{ secrets.EGTRAIN_PUBLISH_TOKEN }}
          DIRS: ${{ steps.pages.outputs.dirs }}
        run: |
          read -ra dirs <<< "$DIRS"
          python3 tools/release/publish_selfhost.py site pages "${dirs[@]}"

  # GitHub Pages serves the gh-pages branch at https://ancientkingg.github.io/EGTRAIN/, the address that EGTRAIN 1.0.4 and
  # 1.0.5 open from Help. The branch holds only .nojekyll and docs/site/redirect.html as index.html and 404.html, which
  # send every address under /EGTRAIN/ to the same path on egtrain.samuelbruin.com. A run commits only when the branch
  # differs from these files, and only while its commit is still the tip of main, so that an older run never writes older
  # files. Another run can push first, so a rejected push starts again from the new tip.
  redirect:
    name: Keep the redirect on gh-pages
    needs: build
    if: github.event_name == 'push' || needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write the redirect to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" != "$GITHUB_SHA" ]; then
              echo "main has advanced; its newer run writes the redirect."
              exit 0
            fi
            git worktree remove --force pages 2>/dev/null || true
            if git fetch --depth 1 origin gh-pages; then
              git worktree add --no-checkout --detach pages FETCH_HEAD
            else
              git worktree add --orphan -b gh-pages pages
            fi
            cp docs/site/redirect.html pages/index.html
            cp docs/site/redirect.html pages/404.html
            touch pages/.nojekyll
            git -C pages add -A
            if git -C pages diff --cached --quiet; then
              echo "gh-pages holds the redirect only."
              exit 0
            fi
            git -C pages commit -q -m "Redirect the documentation to egtrain.samuelbruin.com"
            if git -C pages push origin HEAD:refs/heads/gh-pages; then
              exit 0
            fi
          done
          exit 1
