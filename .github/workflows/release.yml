name: Release

# Builds downloadable applications for macOS, Windows, and Linux.
# Production pushes publish a newer stable version with platform packages and scenes.
# v* tags publish releases using the tag name. Manual runs test the full pipeline.
on:
  push:
    branches:
      - production
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - production
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Production and tag releases share version allocation and must not overlap.
concurrency:
  group: ${{ github.event_name == 'push' && 'egtrain-publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  version:
    name: Select application version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/version.py

  validation:
    needs: version
    name: Full validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Qt
        run: brew install qt@5 zeromq cppzmq nlohmann-json

      - name: Configure
        run: cmake -S . -B build "-DEGTRAIN_VERSION=${{ needs.version.outputs.version }}" -DEGTRAIN_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --output-log "$RUNNER_TEMP/ctest.log"

      - name: Run headless canonical scene smokes
        run: python3 tools/e2e/headless_smoke.py 1 2 3 4 5 6 7

      - name: Run editor smoke
        run: tools/e2e/editor_smoke.sh

      - name: Run scene roundtrip smoke
        run: python3 tools/e2e/roundtrip_smoke.py

      - name: Run bundle smoke
        run: python3 tools/e2e/bundle_smoke.py build/scene_tool build/QEGTRAIN.app/Contents/MacOS/QEGTRAIN

      - name: Run assignment smoke
        run: python3 tools/e2e/assignment_smoke.py

      - name: Run incident smoke
        run: python3 tools/e2e/incident_smoke.py

      - name: Run scene render smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/e2e/scene_render_smoke.sh

      - name: Run track preview smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/e2e/track_preview_smoke.sh

      - name: Run visual smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/e2e/visual_polish_smoke.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            tools/e2e/headless_case_*.log
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/qegtrain-editor-smoke-e2e.log
            ${{ runner.temp }}/qegtrain-incident-*.log
            ${{ runner.temp }}/qegtrain-scene-render-e2e.log
            ${{ runner.temp }}/qegtrain-scene-render-e2e.png
            ${{ runner.temp }}/qegtrain-visual-polish-e2e.log
            ${{ runner.temp }}/qegtrain-visual-polish-e2e.png
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore

  sanitizer:
    needs: version
    name: Sanitizers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Qt
        run: brew install qt@5 zeromq cppzmq nlohmann-json

      - name: Configure
        run: >
          cmake -S . -B build "-DEGTRAIN_VERSION=${{ needs.version.outputs.version }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DEGTRAIN_BUILD_TESTS=ON
          -DEGTRAIN_ENABLE_SANITIZERS=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          QEGTRAIN_GUI_SMOKE_MARKER_SECONDS: "360"
          QEGTRAIN_GUI_SMOKE_SECONDS: "30"
        run: ctest --test-dir build --output-on-failure --output-log "$RUNNER_TEMP/ctest-sanitizer.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            ${{ runner.temp }}/ctest-sanitizer.log
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish GitHub Release
    needs: [version, validation, sanitizer, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Set release metadata
        id: release-meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            name="EGTRAIN $GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=true
              make_latest=false
            else
              prerelease=false
              make_latest=true
            fi
          else
            tag="v${{ needs.version.outputs.version }}"
            name="EGTRAIN $tag"
            prerelease=false
            make_latest=true
            production_commit="$(git ls-remote origin refs/heads/production | cut -f1)"
            if [[ "$production_commit" != "$GITHUB_SHA" ]]; then
              echo "Production has advanced; publish its latest run instead of this stale run."
              exit 1
            fi
            release_tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
            if [[ -n "$(git ls-remote origin "refs/tags/$tag")" ]] || grep -Fxq "$tag" <<< "$release_tags"; then
              echo "Release tag $tag already exists. Rerun all jobs to allocate a new version."
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          test -n "$version"
          mac_sha="$(sha256sum artifacts/QEGTRAIN-macos-arm64/QEGTRAIN-macos-arm64.zip | cut -d ' ' -f 1)"
          windows_sha="$(sha256sum artifacts/QEGTRAIN-windows-x64/QEGTRAIN-windows-x64.zip | cut -d ' ' -f 1)"
          linux_sha="$(sha256sum artifacts/QEGTRAIN-linux-x86_64/QEGTRAIN-linux-x86_64.AppImage | cut -d ' ' -f 1)"
          mac_size="$(stat -c %s artifacts/QEGTRAIN-macos-arm64/QEGTRAIN-macos-arm64.zip)"
          windows_size="$(stat -c %s artifacts/QEGTRAIN-windows-x64/QEGTRAIN-windows-x64.zip)"
          linux_size="$(stat -c %s artifacts/QEGTRAIN-linux-x86_64/QEGTRAIN-linux-x86_64.AppImage)"
          windows_files="$(unzip -Z1 artifacts/QEGTRAIN-windows-x64/QEGTRAIN-windows-x64.zip | tr '\\' '/' | grep -v '/$' | jq -Rn '[inputs]')"
          jq -e 'index("QEGTRAIN.exe")' <<< "$windows_files" > /dev/null
          jq -n \
            --arg version "$version" \
            --arg mac_sha "$mac_sha" \
            --arg windows_sha "$windows_sha" \
            --arg linux_sha "$linux_sha" \
            --argjson mac_size "$mac_size" \
            --argjson windows_size "$windows_size" \
            --argjson linux_size "$linux_size" \
            --argjson windows_files "$windows_files" \
            '{version:$version,assets:{"macos-arm64":{name:"QEGTRAIN-macos-arm64.zip",sha256:$mac_sha,size:$mac_size},"windows-x64":{name:"QEGTRAIN-windows-x64.zip",sha256:$windows_sha,size:$windows_size,files:$windows_files},"linux-x86_64":{name:"QEGTRAIN-linux-x86_64.AppImage",sha256:$linux_sha,size:$linux_size}}}' \
            > artifacts/update-manifest.json
          test -s artifacts/update-manifest.json

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            artifacts/QEGTRAIN-macos-arm64/QEGTRAIN-macos-arm64.zip
            artifacts/QEGTRAIN-windows-x64/QEGTRAIN-windows-x64.zip
            artifacts/QEGTRAIN-linux-x86_64/QEGTRAIN-linux-x86_64.AppImage
            artifacts/EGTRAIN-scenes/Netherlands.egscene
            artifacts/EGTRAIN-scenes/Paimpol.egscene
            artifacts/EGTRAIN-scenes/Copenhagen.egscene
            artifacts/EGTRAIN-scenes/Milano_Brescia.egscene
            artifacts/EGTRAIN-scenes/Assignment_Gvc_Gdg_Ut.egscene
            artifacts/EGTRAIN-scenes/Lebanon.egscene
            artifacts/EGTRAIN-scenes/Amsterdam_Hilversum_Student.egscene
            artifacts/update-manifest.json
          )

          for file in "${expected[@]}"; do
            test -s "$file"
          done

          count="$(find artifacts -type f | wc -l | tr -d ' ')"
          if [[ "$count" != "11" ]]; then
            echo "Expected exactly 11 release assets, found $count"
            find artifacts -type f -print
            exit 1
          fi

      - name: Prepare release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-meta.outputs.name }}
          files: |
            artifacts/QEGTRAIN-macos-arm64/QEGTRAIN-macos-arm64.zip
            artifacts/QEGTRAIN-windows-x64/QEGTRAIN-windows-x64.zip
            artifacts/QEGTRAIN-linux-x86_64/QEGTRAIN-linux-x86_64.AppImage
            artifacts/EGTRAIN-scenes/*.egscene
            artifacts/update-manifest.json
          prerelease: ${{ steps.release-meta.outputs.prerelease }}
          make_latest: ${{ steps.release-meta.outputs.make_latest }}
          fail_on_unmatched_files: true
          draft: true
          body: |
            Automated EGTRAIN build for `${{ steps.release-meta.outputs.name }}`.

            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the package for your platform. Case studies are also available as `.egscene` files.

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
          MAKE_LATEST: ${{ steps.release-meta.outputs.make_latest }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"
