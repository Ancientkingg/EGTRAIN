name: Release

# Builds downloadable applications for macOS, Windows, and Linux.
# Production pushes publish a newer stable version with platform packages and scenes.
# v* tags publish releases using the tag name. Manual runs test the full pipeline.
on:
  push:
    branches:
      - production
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - production
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Production and tag releases share version allocation and must not overlap.
concurrency:
  group: ${{ github.event_name == 'push' && 'egtrain-publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  version:
    name: Select application version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/version.py

  validation:
    needs: version
    name: Full validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtcharts
          cache: true

      - name: Install dependencies
        run: brew install zeromq cppzmq nlohmann-json

      # As in cmake.yml: the keg folders of the other libraries, and the OpenGL framework in place of the AGL framework that
      # Qt 6.8.3 links and that the macOS 26 SDK no longer has.
      - name: Configure
        run: >
          cmake -S . -B build "-DEGTRAIN_VERSION=${{ needs.version.outputs.version }}" -DEGTRAIN_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix zeromq);$(brew --prefix cppzmq);$(brew --prefix nlohmann-json)"
          -DWrapOpenGL_AGL="$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenGL.framework"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --output-log "$RUNNER_TEMP/ctest.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            tools/e2e/headless_case_*.log
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/qegtrain-editor-smoke-e2e.log
            ${{ runner.temp }}/qegtrain-incident-*.log
            ${{ runner.temp }}/qegtrain-scene-render-e2e.log
            ${{ runner.temp }}/qegtrain-scene-render-e2e.png
            ${{ runner.temp }}/qegtrain-visual-polish-e2e.log
            ${{ runner.temp }}/qegtrain-visual-polish-e2e.png
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore

  sanitizer:
    needs: version
    name: Sanitizers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtcharts
          cache: true

      - name: Install dependencies
        run: brew install zeromq cppzmq nlohmann-json

      # The instrumented tests run many times slower than the default time limits allow, so the limits are scaled up.
      - name: Configure
        run: >
          cmake -S . -B build "-DEGTRAIN_VERSION=${{ needs.version.outputs.version }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DEGTRAIN_BUILD_TESTS=ON
          -DEGTRAIN_ENABLE_SANITIZERS=ON
          -DEGTRAIN_TEST_TIMEOUT_SCALE=10
          -DEGTRAIN_CHARACTERIZATION_SCENE_TIMEOUT=5400
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix zeromq);$(brew --prefix cppzmq);$(brew --prefix nlohmann-json)"
          -DWrapOpenGL_AGL="$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenGL.framework"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          QEGTRAIN_GUI_SMOKE_MARKER_SECONDS: "360"
          QEGTRAIN_GUI_SMOKE_SECONDS: "30"
        run: ctest --test-dir build --parallel 3 --output-on-failure --output-log "$RUNNER_TEMP/ctest-sanitizer.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            ${{ runner.temp }}/ctest-sanitizer.log
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    permissions:
      actions: read
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  release:
    name: Publish GitHub Release
    needs: [version, validation, sanitizer, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Set release metadata
        id: release-meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            name="EGTRAIN $GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=true
              make_latest=false
            else
              prerelease=false
              make_latest=true
            fi
          else
            tag="v${{ needs.version.outputs.version }}"
            name="EGTRAIN $tag"
            prerelease=false
            make_latest=true
            production_commit="$(git ls-remote origin refs/heads/production | cut -f1)"
            if [[ "$production_commit" != "$GITHUB_SHA" ]]; then
              echo "Production has advanced; publish its latest run instead of this stale run."
              exit 1
            fi
            release_tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
            if [[ -n "$(git ls-remote origin "refs/tags/$tag")" ]] || grep -Fxq "$tag" <<< "$release_tags"; then
              echo "Release tag $tag already exists. Rerun all jobs to allocate a new version."
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build the release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 tools/release/build_release_assets.py --version "$VERSION" --artifacts artifacts --output release-assets

      - name: Prepare release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-meta.outputs.name }}
          files: release-assets/*
          prerelease: ${{ steps.release-meta.outputs.prerelease }}
          make_latest: ${{ steps.release-meta.outputs.make_latest }}
          fail_on_unmatched_files: true
          draft: true
          body: |
            Automated EGTRAIN build for `${{ steps.release-meta.outputs.name }}`.

            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the package for your platform. The bundled cases are also available as `.egscene` files.

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
          MAKE_LATEST: ${{ steps.release-meta.outputs.make_latest }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"
