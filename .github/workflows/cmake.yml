name: CMake

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  # One run a night on main. A scheduled run uses the default branch and ignores the path filters.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# A newer push to the same pull request replaces its running checks. A scheduled or manual run has
# a group of its own and no other run cancels it.
concurrency:
  group: cmake-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            jobs: 3
          - name: Windows
            os: windows-latest
            jobs: 4
          - name: Linux
            os: ubuntu-latest
            jobs: 4
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CTest GUI checks write logs to the platform temp dir; point it at
      # runner.temp so failure diagnostics can find them.
      - name: Route temp files to runner.temp
        if: runner.os != 'Windows'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Route temp files to runner.temp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@5 zeromq cppzmq nlohmann-json

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5charts5-dev libqt5svg5-dev libqt5network5 \
            libzmq3-dev cppzmq-dev nlohmann-json3-dev

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg binary cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-zeromq-cppzmq-nlohmann-json-v1

      - name: Install ZeroMQ, cppzmq, nlohmann-json (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = "$env:RUNNER_TEMP/vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
          vcpkg install zeromq cppzmq nlohmann-json --triplet x64-windows

      - name: Save vcpkg binary cache
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-zeromq-cppzmq-nlohmann-json-v1

      # The tests find the vcpkg and Qt DLLs here, so the build copies none next to each executable.
      - name: Add runtime DLL directories to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:QT_ROOT_DIR/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DEGTRAIN_BUILD_TESTS=ON -DEGTRAIN_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DEGTRAIN_BUILD_TESTS=ON -DEGTRAIN_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -DEGTRAIN_BUILD_TESTS=ON -DEGTRAIN_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      # Prints SizeOfImage in the job summary. test_windows_image_size enforces the limit.
      - name: Report Windows image size
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/release/pe_image_size.py build/Release/QEGTRAIN.exe --max-bytes 4294967295 | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --parallel ${{ matrix.jobs }} --output-on-failure --output-log "$RUNNER_TEMP/ctest.log"

      # The same files as the Windows release package, started with only the operating
      # system directories on PATH: a DLL or plugin missing from the package fails here.
      - name: Start an assembled Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "$env:RUNNER_TEMP/package/QEGTRAIN"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/Release/QEGTRAIN.exe "$dist/QEGTRAIN.exe"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" $dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime --no-opengl-sw --no-angle --no-system-d3d-compiler --no-virtualkeyboard --no-quick-import "$dist/QEGTRAIN.exe"
          Copy-Item -Recurse EGTRAIN/QEGTRAIN/Scenes "$dist/Scenes"
          python tools/release/package_start_smoke.py $dist

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-${{ matrix.name }}-diagnostics
          path: |
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore

  # LeakSanitizer finds the leaks and double frees that a normal run does not show. It does not run on
  # macOS with Apple silicon, so this job uses Linux. The Debug build with sanitizers and the
  # instrumented runs take longer than the pull request checks, so only the nightly and manual runs
  # start it. Start it by hand for a branch with: gh workflow run cmake.yml --ref BRANCH
  leak-check:
    name: leak check (Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      PYTHONUTF8: "1"
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/e2e/lsan_suppressions.txt

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5charts5-dev libqt5svg5-dev libqt5network5 \
            libzmq3-dev cppzmq-dev nlohmann-json3-dev

      # With the default setting, the address sanitizer can crash at start on the kernel of the runner.
      - name: Lower address space randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEGTRAIN_BUILD_TESTS=ON -DEGTRAIN_ENABLE_SANITIZERS=ON

      - name: Build with sanitizers
        id: build
        run: cmake --build build --target QEGTRAIN test_characterization

      # Every scene runs once and the script reports all failing scenes together. The log of each run is kept.
      - name: Run the committed scenes headless
        run: python3 tools/e2e/leak_check_smoke.py build/QEGTRAIN "$RUNNER_TEMP/leak-check"

      # Each test runs scenes one after the other in one process, so that every run builds its scene,
      # resets and builds the next one again.
      - name: Reload scenes in one process
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/leak-check"
          ctest --test-dir build --parallel 2 --no-tests=error --output-on-failure \
            --output-log "$RUNNER_TEMP/leak-check/ctest-reload.log" \
            -R '^(characterization_repeatable|characterization_repeat_paimpol|characterization_repeat_lebanon_milano|characterization_repeat_netherlands)$'

      - name: Upload leak check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: leak-check-logs
          path: ${{ runner.temp }}/leak-check
          if-no-files-found: ignore
