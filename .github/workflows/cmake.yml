name: CMake

on:
  pull_request:
    branches: [main]
  # One run a night on main. A scheduled run uses the default branch.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# A newer push to the same pull request replaces its running checks. A scheduled or manual run has
# a group of its own and no other run cancels it.
concurrency:
  group: cmake-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pull request to main starts this workflow, so that the result job below always reports and main can require
  # it. A pull request that changes only Markdown files, docs/, LICENSE or the issue templates needs no build; any other
  # event always builds.
  changes:
    name: Select the CMake jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The merge commit of a pull request has the base branch as its first parent. The rule is the cmake entry of the
      # script. A failure here fails the job, and an empty list of files builds.
      - name: Select the build from the changed files
        id: select
        run: python3 tools/ci/changed_files.py cmake HEAD^1 HEAD --event "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"

  # CTest runs the same check, but the build job skips CTest for a pull request that changes only documentation.
  docs:
    name: Check the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the documentation check
        run: python3 tools/docs/check_docs.py

  # A skipped matrix job is listed under its unexpanded name, so the legs always start and each step checks the output
  # of the changes job. Every leg builds with Qt 6.8.3 from install-qt-action. The Linux leg and the Linux sanitizer jobs
  # run on Ubuntu 24.04, the system that builds the AppImage in package.yml.
  build:
    name: build (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            jobs: 3
            cache: ccache
          - name: Windows
            os: windows-latest
            jobs: 4
            cache: sccache
          - name: Linux
            os: ubuntu-24.04
            jobs: 4
            cache: ccache
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.build == 'true'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.build == 'true'
        with:
          python-version: '3.12'

      # The runner image fixes the compiler and, on Windows, the vcpkg checkout. Its version is part of the key of the
      # compiler cache and of the vcpkg binary cache, so a new image starts a new entry.
      - name: Identify the runner image
        if: needs.changes.outputs.build == 'true'
        id: image
        shell: pwsh
        run: |
          "id=$($env:ImageOS ?? 'unknown')-$($env:ImageVersion ?? 'unknown')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # CTest GUI checks write logs to the platform temp dir; point it at
      # runner.temp so failure diagnostics can find them.
      - name: Route temp files to runner.temp
        if: needs.changes.outputs.build == 'true' && runner.os != 'Windows'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Route temp files to runner.temp (Windows)
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Qt 6.8.3, and the libraries from Homebrew on macOS and from apt on Linux. On Windows the MSVC environment; the
      # configure step installs the libraries of the vcpkg manifest.
      - name: Set up the dependencies
        if: needs.changes.outputs.build == 'true'
        uses: ./.github/actions/setup-deps

      # The packages and the builtin-baseline of the vcpkg manifest, for the key of the vcpkg binary cache.
      - name: Read the vcpkg manifest
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        id: vcpkg-manifest
        shell: pwsh
        run: |
          $manifest = Get-Content tools/vcpkg/vcpkg.json -Raw | ConvertFrom-Json
          "key=$($manifest.dependencies -join '-')-$($manifest.'builtin-baseline')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # vcpkg names an archive by an ABI hash that covers its own checkout, its CMake and the compiler. A runner image with
      # another vcpkg commit restores no archive from an older entry, so the key has the image version and a new image
      # writes a new entry. The key also has the packages and the baseline of the manifest, so a change to the manifest
      # writes a new entry as well. Raise v1 to start over. The configure step installs the packages, and the save step
      # follows it.
      - name: Restore vcpkg binary cache
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-${{ steps.vcpkg-manifest.outputs.key }}-${{ steps.image.outputs.id }}-v1

      # The tests find the vcpkg and Qt DLLs here, so the build copies none next to each executable.
      - name: Add runtime DLL directories to PATH (Windows)
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:QT_ROOT_DIR/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Compiled objects are cached: ccache on macOS and Linux, sccache on Windows. The post step of the action prints the
      # hits and misses of the job and saves a new entry under the key and a timestamp. A run restores the newest entry of
      # its leg and image, or else of its leg. A pull request sees its own earlier entries and those of main, which only
      # the nightly run writes. That is enough: a pull request compiles again what changed since the last night or since
      # its previous run, and a push trigger would add a full run after every merge.
      - name: Set up compiler cache
        if: needs.changes.outputs.build == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ matrix.cache }}
          key: ${{ matrix.name }}-${{ steps.image.outputs.id }}
          restore-keys: |
            ${{ matrix.name }}

      # The ci presets of CMakePresets.json hold the options of all three legs: the tests, warnings as errors and no
      # interprocedural optimization (EGTRAIN_IPO=OFF), in build/. Linking with interprocedural optimization generates the code
      # of the whole program again for every test executable, which a compiler cache cannot store. The package and release
      # workflows still build with it, so the shipped binaries and the package checks use it.
      # The keg folders, not the Homebrew prefix, whose include folder could hold the headers of a linked Homebrew Qt. Qt 6.8.3
      # links the AGL framework, which the macOS 26 SDK no longer has, so the OpenGL framework stands in for it.
      - name: Configure (macOS)
        if: needs.changes.outputs.build == 'true' && runner.os == 'macOS'
        run: >
          cmake --preset ci-macos
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.cache }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cache }}
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix zeromq);$(brew --prefix cppzmq);$(brew --prefix nlohmann-json)"
          -DWrapOpenGL_AGL="$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenGL.framework"

      - name: Configure (Linux)
        if: needs.changes.outputs.build == 'true' && runner.os == 'Linux'
        run: >
          cmake --preset ci-linux -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.cache }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cache }}
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      # The Visual Studio generator ignores a compiler launcher, so this leg builds with Ninja in the MSVC environment set
      # up above, and names cl because CMake would otherwise take the gcc of the runner image. The Release configuration
      # adds no /Zi, so sccache can store the objects. The executable is build/QEGTRAIN.exe.
      # The ci-windows preset installs the packages of the manifest tools/vcpkg/vcpkg.json with the vcpkg of the runner image.
      # The image clones vcpkg in full and a new image updates the clone, so it holds the builtin-baseline commit of the
      # manifest. The packages go into the installed folder of that vcpkg, where the DLL steps of this job read them, and
      # their archives go into the folder of the binary cache.
      - name: Configure (Windows)
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite"
        run: >
          cmake --preset ci-windows -DEGTRAIN_NETWORK_TESTS=ON
          -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.cache }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cache }}
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Save vcpkg binary cache
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-${{ steps.vcpkg-manifest.outputs.key }}-${{ steps.image.outputs.id }}-v1

      - name: Build
        if: needs.changes.outputs.build == 'true'
        run: cmake --build build --config Release

      # Prints SizeOfImage in the job summary. test_windows_image_size enforces the limit.
      - name: Report Windows image size
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: python tools/release/pe_image_size.py build/QEGTRAIN.exe --max-bytes 4294967295 | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Test
        if: needs.changes.outputs.build == 'true'
        shell: bash
        run: ctest --test-dir build -C Release --parallel ${{ matrix.jobs }} --output-on-failure --output-log "$RUNNER_TEMP/ctest.log" -LE network

      # One real request to the GitHub release list through the update transport, which is WinHTTP on Windows. It fails when
      # no HTTPS response arrives. When GitHub answers with its rate limit or an outage, the test is skipped.
      - name: Check HTTPS (Windows)
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        shell: bash
        run: ctest --test-dir build -C Release -L network --no-tests=error --output-on-failure

      # The same files as the Windows release package, started with only the operating
      # system directories on PATH: a DLL or plugin missing from the package fails here.
      # The runner has the Visual C++ runtime installed, so the import check of the package workflow
      # finds a runtime DLL missing from the package, not this step.
      - name: Start an assembled Windows package
        if: needs.changes.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "$env:RUNNER_TEMP/package/QEGTRAIN"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/QEGTRAIN.exe "$dist/QEGTRAIN.exe"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" $dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler --no-quick-import "$dist/QEGTRAIN.exe"
          Copy-Item -Recurse EGTRAIN/QEGTRAIN/Scenes "$dist/Scenes"
          python tools/release/package_start_smoke.py $dist --exports

      # A shell smoke that fails keeps the folder of its run, qegtrain-<smoke>-e2e.<random> below TMPDIR. The headless
      # smoke writes the log of each case into build/smoke-logs.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-${{ matrix.name }}-diagnostics
          path: |
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
            ${{ runner.temp }}/qegtrain-incident-*.log
            ${{ runner.temp }}/qegtrain-*-e2e.*/
            build/smoke-logs/headless_case_*.log
          if-no-files-found: ignore

  # LeakSanitizer finds the leaks and double frees that a normal run does not show. It does not run on
  # macOS with Apple silicon, so this job uses Linux. The Debug build with sanitizers and the
  # instrumented runs take longer than the pull request checks, so only the nightly and manual runs
  # start it. Start it by hand for a branch with: gh workflow run cmake.yml --ref BRANCH
  leak-check:
    name: leak check (Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      PYTHONUTF8: "1"
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/e2e/lsan_suppressions.txt

    steps:
      - uses: actions/checkout@v4

      - name: Set up the dependencies
        uses: ./.github/actions/setup-deps

      # With the default setting, the address sanitizer can crash at start on the kernel of the runner.
      - name: Lower address space randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure with sanitizers
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEGTRAIN_BUILD_TESTS=ON -DEGTRAIN_ENABLE_SANITIZERS=ON -DEGTRAIN_CHARACTERIZATION_SCENE_TIMEOUT=1500
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build with sanitizers
        id: build
        run: cmake --build build --target QEGTRAIN test_characterization test_networkpresenter test_runtimecanvas test_guisimulationsnapshot

      # Every scene runs once and the script reports all failing scenes together. The log of each run is kept.
      - name: Run the committed scenes headless
        run: python3 tools/e2e/leak_check_smoke.py build/QEGTRAIN "$RUNNER_TEMP/leak-check"

      # Each test runs scenes one after the other in one process, so that every run builds its scene,
      # resets and builds the next one again.
      - name: Reload scenes in one process
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/leak-check"
          ctest --test-dir build --parallel 2 --no-tests=error --output-on-failure \
            --output-log "$RUNNER_TEMP/leak-check/ctest-reload.log" \
            -R '^(characterization_repeatable|characterization_repeat_paimpol|characterization_repeat_milano_paimpol|characterization_repeat_netherlands)$'

      # The canvas is drawn, filled with the steps of a run and of its replay, and cleared again and again in one process.
      - name: Rebuild the canvas in one process
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/leak-check"
          ctest --test-dir build --no-tests=error --output-on-failure \
            --output-log "$RUNNER_TEMP/leak-check/ctest-canvas.log" \
            -R '^(test_networkpresenter|test_runtimecanvas)$'

      # The replay history records, evicts and clears frames, and the bytes it counts are compared with the heap.
      - name: Record and clear the replay history
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/leak-check"
          ctest --test-dir build --no-tests=error --output-on-failure \
            --output-log "$RUNNER_TEMP/leak-check/ctest-replay.log" \
            -R '^test_guisimulationsnapshot$'

      - name: Upload leak check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: leak-check-logs
          path: ${{ runner.temp }}/leak-check
          if-no-files-found: ignore

  # The whole suite with AddressSanitizer and UndefinedBehaviorSanitizer, in the configuration of the Sanitizers job of
  # release.yml, which runs it on macOS before a release. This job runs it on Linux every night, so that a finding shows
  # the day after the change. Only the nightly and manual runs start it, and the result job does not wait for it, so it
  # never decides a pull request.
  sanitizers:
    name: sanitizers (Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up the dependencies
        uses: ./.github/actions/setup-deps

      # With the default setting, the address sanitizer can crash at start on the kernel of the runner.
      - name: Lower address space randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The options of the Sanitizers job of release.yml, with the Linux prefix path.
      - name: Configure with sanitizers
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEGTRAIN_BUILD_TESTS=ON -DEGTRAIN_ENABLE_SANITIZERS=ON
          -DEGTRAIN_TEST_TIMEOUT_SCALE=10 -DEGTRAIN_CHARACTERIZATION_SCENE_TIMEOUT=5400
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build with sanitizers
        run: cmake --build build

      # The environment of the release job. Leak detection and the fake stack for returned frames are off by default on
      # macOS and on by default on Linux, so they are turned off here; the leak check above owns the leaks. The known
      # reports of UndefinedBehaviorSanitizer are listed in a suppressions file. A test without a time limit of its own
      # stops after 1500 seconds, so that a hang shows in the log instead of ending the job.
      - name: Test with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/tools/e2e/ubsan_suppressions.txt
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=0:detect_stack_use_after_return=0
          QEGTRAIN_GUI_SMOKE_MARKER_SECONDS: "360"
          QEGTRAIN_GUI_SMOKE_SECONDS: "30"
        run: ctest --test-dir build --parallel 4 --timeout 1500 --output-on-failure --output-log "$RUNNER_TEMP/ctest-sanitizer.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            ${{ runner.temp }}/ctest-sanitizer.log
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore

  # ThreadSanitizer finds data races in the parts that run on more than one thread: the recovery writer, the telemetry
  # sender, the live server and the simulation worker. Qt is not instrumented, so the job runs the tests of those parts and
  # not the windows. Only the nightly and manual runs start it, and the result job does not wait for it.
  thread-sanitizer:
    name: thread sanitizer (Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      PYTHONUTF8: "1"
      # Qt, libzmq and the C library are not instrumented, so the accesses they make themselves are ignored. The
      # suppressions file lists the known reports.
      TSAN_OPTIONS: second_deadlock_stack=1:ignore_noninstrumented_modules=1:suppressions=${{ github.workspace }}/tools/e2e/tsan_suppressions.txt

    steps:
      - uses: actions/checkout@v4

      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up the dependencies
        uses: ./.github/actions/setup-deps

      # With the default setting, ThreadSanitizer stops at start on the kernel of the runner.
      - name: Lower address space randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure with ThreadSanitizer
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEGTRAIN_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DEGTRAIN_TEST_TIMEOUT_SCALE=10
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build with ThreadSanitizer
        run: >
          cmake --build build --target test_recoverycontroller test_telemetrysender test_liveserver test_livereplay
          test_simulationworker

      - name: Test the threaded parts
        run: >
          ctest --test-dir build --no-tests=error --output-on-failure --output-log "$RUNNER_TEMP/ctest-thread-sanitizer.log"
          -R '^(test_recoverycontroller|test_telemetrysender|test_liveserver|test_livereplay|test_simulationworker)$'

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: ${{ runner.temp }}/ctest-thread-sanitizer.log
          if-no-files-found: ignore

  # The one check that main requires. It succeeds when every job above succeeded or was skipped. The nightly sanitizer
  # jobs are not part of it.
  result:
    name: CMake result
    if: always()
    needs: [changes, docs, build, leak-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
