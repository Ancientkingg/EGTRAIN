name: CMake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # CTest GUI checks write logs to the platform temp dir; point it at
      # runner.temp so failure diagnostics can find them.
      - name: Route temp files to runner.temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Qt
        run: brew install qt@5 libomp zeromq cppzmq nlohmann-json

      - name: Configure
        run: cmake -S . -B build -DEGTRAIN_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --output-log "$RUNNER_TEMP/ctest.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/qegtrain-gui-autostart-smoke.log
          if-no-files-found: ignore
